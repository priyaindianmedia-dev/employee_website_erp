<style>
:root{--red:#B51218;--black:#191919;--white:#fff;--bg:#FAF6F0;--grey:#777;--card:#fff;--text:#191919;--line:#e3e5e9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font:inherit;cursor:pointer}
.hide{display:none!important}
/* logo placeholder – replace LOGO_SRC in script with the original logo file */
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.logo img{height:38px;width:auto;display:block}
.mark{width:38px;height:38px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 62%,62% 100%,0 100%);display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.logo b{display:block;letter-spacing:.08em;font-size:15px;line-height:1.1}.logo small{color:#aaa;font-size:10px;letter-spacing:.1em}
/* login */
#login{min-height:100vh;display:flex;flex-direction:column;background:#FAF6F0;position:relative}
#login:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(25,25,25,.035) 0 2px,transparent 2px 18px)}
#login header{padding:20px 28px;position:relative}#login .logo{color:#191919}#login .logo small{color:#777}
.lwrap{flex:1;display:grid;place-items:center;padding:20px;position:relative}
.lcard{background:#fff;color:#191919;width:100%;max-width:400px;border-radius:10px;padding:32px;border-top:4px solid var(--red);box-shadow:0 10px 30px rgba(0,0,0,.12);border-left:1px solid #e3e5e9;border-right:1px solid #e3e5e9;border-bottom:1px solid #e3e5e9}
.lcard h1{margin:0;font-size:22px;letter-spacing:.06em}.lcard p.s{margin:2px 0 22px;color:var(--grey);font-size:12px;letter-spacing:.14em;font-weight:600}
label.f{display:block;font-size:12px;font-weight:600;margin:14px 0 6px}
.inp{width:100%;padding:10px 12px;border:1px solid #d5d8dd;border-radius:6px;font:inherit;background:#fff;color:#191919}
.inp:focus{outline:2px solid var(--red);outline-offset:-1px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--grey);padding:6px}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:13px}
a{color:var(--red);text-decoration:none}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#9a0f14}.btn.g{background:#e9eaed;color:#191919}.btn.full{width:100%;justify-content:center}
.err{color:var(--red);font-size:12px;min-height:16px;margin-top:6px}
.dev{margin-top:16px;font-size:11px;color:var(--grey);text-align:center}
/* app */
#side{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--black);color:#ccc;overflow-y:auto;z-index:30;transition:transform .2s}
#side .logo{padding:16px 18px;border-bottom:1px solid #2c2c2c}
.sec{font-size:10px;letter-spacing:.12em;color:#777;padding:16px 18px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;padding:9px 18px;margin:1px 8px;border-radius:6px;color:#ccc;cursor:pointer}
.nav:hover{background:#262626}.nav.on{background:var(--red);color:#fff}.nav i,.nav svg{width:17px;height:17px}
#main{margin-left:250px;transition:margin .2s}
body.collapsed #side{transform:translateX(-100%)}body.collapsed #main{margin-left:0}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--black);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px}
#top .logo{display:none}
.ib{background:none;border:0;color:#fff;padding:6px;border-radius:6px;display:grid;place-items:center;position:relative}.ib:hover{background:#2c2c2c}
.search{flex:1;max-width:420px;position:relative}.search input{width:100%;background:#2a2a2a;border:1px solid #3a3a3a;color:#fff;padding:8px 12px 8px 34px;border-radius:6px;font:inherit}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:#999}
.sp{flex:1}
.prof{position:relative}.prof>button{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;padding:4px 6px;border-radius:6px}
.av{width:30px;height:30px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:700;text-transform:uppercase}
.menu{position:absolute;right:0;top:110%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px}
.menu button{width:100%;text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:6px;display:flex;gap:8px;align-items:center}.menu button:hover{background:var(--bg)}
.menu .u{padding:8px 10px;font-size:12px;color:var(--grey);border-bottom:1px solid var(--line);margin-bottom:4px}
#page{padding:24px;max-width:1300px}
h2.t{margin:0;font-size:24px}.sub{color:var(--grey);margin:4px 0 22px}
.welcome{font-size:13px;color:var(--red);font-weight:600;margin-bottom:4px}
.grid{display:grid;gap:14px}.g6{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat .l{color:var(--grey);font-size:12px;font-weight:600}.stat .v{font-size:28px;font-weight:700;margin-top:6px}
h3{margin:26px 0 12px;font-size:15px}.card h3{margin:0 0 12px}
.qa{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}.qa:hover{border-color:var(--red)}.qa svg{color:var(--red);width:18px;height:18px}
.empty{color:var(--grey);padding:18px 0;text-align:center}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:1px solid var(--line)}
.note{background:rgba(181,18,24,.08);border-left:3px solid var(--red);padding:10px 12px;border-radius:4px;margin-bottom:16px;font-size:13px}
.badge{display:inline-block;background:var(--bg);border:1px solid var(--line);color:var(--grey);border-radius:20px;padding:2px 10px;font-size:11px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
@media(max-width:900px){#side{transform:translateX(-100%)}#main{margin-left:0}body.open #side{transform:none}#top .logo{display:flex}#top .logo b,#top .logo small{display:none}.uname{display:none}#page{padding:16px}}
/* light sidebar + header (matches reference screens) */
#side{background:#fff;border-right:1px solid var(--line)}
#side .logo,#top .logo{color:#191919}#side .logo small,#top .logo small{color:#777}#side .logo{border-bottom:1px solid var(--line)}
.sec{color:#777}.nav{color:#191919;font-weight:500}.nav:hover{background:#F5F6F8}
.nav.on{background:#FCE8E9;color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
#top{background:#fff;color:#191919;border-bottom:1px solid var(--line)}
.ib,.prof>button{color:#191919}.ib:hover{background:#F5F6F8}
.search input{background:#F5F6F8;border-color:var(--line);color:#191919}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.big{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:#FCE8E9;color:var(--red);margin:0 auto 14px}.big svg{width:38px;height:38px}
.es{text-align:center;padding:70px 16px}.es h3{font-size:20px;margin:0 0 6px}.es p{color:var(--grey);margin:0 0 18px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}@media(max-width:900px){.two{grid-template-columns:1fr}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}@media(max-width:600px){.fg{grid-template-columns:1fr}}
.fg label,.st{font-weight:600;font-size:13px;display:block;margin-bottom:6px}.req{color:var(--red)}
.st{border-left:3px solid var(--red);padding-left:10px;font-size:16px;margin:0 0 16px}
.fg .inp{color:#191919}.inp.bad{border-color:var(--red)}.em{color:var(--red);font-size:12px;margin-top:4px;min-height:0}
textarea.inp{min-height:76px;resize:vertical}
.dz{border:2px dashed #cfd3d9;border-radius:8px;padding:22px;text-align:center;cursor:pointer;color:var(--grey);margin-top:18px}.dz.on{border-color:var(--red);background:#FCE8E9}.dz svg{width:30px;height:30px}
.pv{min-height:300px;display:grid;place-items:center;text-align:center;color:var(--grey)}.pv img{max-width:100%;max-height:340px;border-radius:8px}
.bar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#F5F6F8}
.toast{position:fixed;right:18px;bottom:18px;padding:12px 16px;border-radius:8px;color:#fff;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}.toast.ok{background:#1f7a3d}.toast.bad{background:var(--red)}
.btn:disabled{opacity:.6;cursor:wait}.lnk{background:none;border:0;color:var(--red);font-weight:600;padding:0}

  return `<div class="phead"><div><h2 class="t">Material Management</h2><p class="sub">Manage all raw materials used in chair manufacturing.</p></div><button class="btn" data-go="p-add-material"><i data-lucide="plus"></i>Add New Material</button></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${sc("Total Materials","All Raw Materials",0)}${sc("In Stock","Available Materials",1)}${sc("Low Stock","Needs Attention",2)}${sc("Total Consumption","This Month",3)}</div>
  <div class="card" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><input class="inp" id="q" style="flex:2;min-width:200px;color:#191919" placeholder="Search Material Name / Code..."><select class="inp" id="fc" style="flex:1;min-width:140px;color:#191919"></select><select class="inp" id="fu" style="flex:1;min-width:120px;color:#191919"></select><select class="inp" id="fs" style="flex:1;min-width:140px;color:#191919"></select><button class="btn" id="fb"><i data-lucide="filter"></i>Filter</button><button class="btn g" id="fr"><i data-lucide="rotate-ccw"></i>Reset</button></div>

}
function fillF(){
  const g=i=>$("#"+i).value,k=[g("fc"),g("fu"),g("fs")];
  const cats=[...MCATS,...MM.map(m=>m.category).filter(c=>c&&!MCATS.includes(c))],sups=[...new Set(MM.map(m=>m.supplier).filter(Boolean))].sort();
  $("#fc").innerHTML=opts(cats,"All Category");$("#fu").innerHTML=opts(UNITS,"All Unit");$("#fs").innerHTML=opts(sups,"All Supplier");
  $("#fc").value=k[0];$("#fu").value=k[1];$("#fs").value=k[2];
}
function renderMM(){
  const box=$("#mml");if(!box)return;
  const has=MM.length>0,low=MM.filter(isLow),inS=MM.filter(m=>Number(m.availableStock)>0);
  const set=(i,t)=>{const e=$("#s"+i);if(e)e.textContent=t};
  set(0,has?MM.length:"-");set(1,has?inS.length:"-");set(2,has?low.length:"-");set(3,"-");
  $("#msm").innerHTML=[["Total Materials",has?MM.length:"-"],["In Stock",has?inS.length:"-"],["Low Stock",has?low.length:"-"],["Consumed This Month","-"]].map(x=>`<div><div style="color:var(--grey);font-size:12px">${x[0]}</div><div style="font-size:22px;font-weight:700;margin-top:6px">${x[1]}</div></div>`).join("");
  $("#mla").className=low.length?"":"empty";
  $("#mla").innerHTML=low.length?`<div class="note" style="margin:0"><b>${low.length} material${low.length>1?"s are":" is"} at or below minimum stock.</b> Replenish to avoid production delay.</div><table><thead><tr><th>Material</th><th>Available</th><th>Minimum</th></tr></thead><tbody>${low.slice(0,6).map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.availableStock)} ${esc(m.unit)}</td><td>${esc(m.minStock)} ${esc(m.unit)}</td></tr>`).join("")}</tbody></table>`:"No low stock alerts.";
  if(!has){box.innerHTML='<div class="es"><div class="big"><i data-lucide="boxes"></i></div><h3>No Materials Added Yet</h3><p>Add your first raw material to start managing your inventory.</p><button class="btn" data-go="p-add-material"><i data-lucide="plus"></i>Add New Material</button></div>';box.querySelector("[data-go]").onclick=()=>location.hash="p-add-material";icons();return}
  const q=$("#q").value.trim().toLowerCase(),c=$("#fc").value,u=$("#fu").value,s=$("#fs").value;
  const rows=MM.filter(m=>(!q||String(m.name).toLowerCase().includes(q)||String(m.code||"").toLowerCase().includes(q))&&(!c||m.category===c)&&(!u||m.unit===u)&&(!s||m.supplier===s));
  if(!rows.length){box.innerHTML='<div class="empty">No materials match your filters.</div>';return}
  box.innerHTML='<div class="tw"><table><thead><tr><th></th><th>Code</th><th>Material</th><th>Category</th><th>Warehouse</th><th>Supplier</th><th>Available</th><th>Minimum</th><th>Status</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${String(r.imageUrl||"").match(/^(\/_blob\/|data:image\/)/)?`<img class="thumb" src="${esc(r.imageUrl)}" alt="">`:'<div class="thumb"></div>'}</td><td>${esc(r.code||"-")}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.category)}</td><td>${esc(r.warehouse||"-")}</td><td>${esc(r.supplier||"-")}</td><td><b>${esc(r.availableStock)}</b> ${esc(r.unit)}</td><td>${esc(r.minStock===""||r.minStock==null?"-":r.minStock)}</td><td>${isLow(r)?'<span class="badge" style="color:#B51218;border-color:#B51218">Low stock</span>':'<span class="badge">OK</span>'}</td></tr>`).join("")+'</tbody></table></div>';
}
async function initMM(){
  const box=$("#mml"),db=await getDb();if(!box)return;
  MM=[];fillF();
  if(!db){box.innerHTML='<div class="empty">Database is not available. Open this page signed in to claude.ai.</div>';return}
  let loaded=false;const tm=setTimeout(()=>{if(!loaded)box.innerHTML='<div class="empty">Could not load materials.</div>'},10000);
  unsub=db.collection("raw_materials").onSnapshot(s=>{loaded=true;clearTimeout(tm);MM=s.docs.map(d=>d.data()).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));fillF();renderMM()},()=>{clearTimeout(tm);box.innerHTML='<div class="empty">Could not load materials.</div>'});
  ["q","fc","fu","fs"].forEach(i=>$("#"+i).oninput=renderMM);$("#fb").onclick=renderMM;
  $("#fr").onclick=()=>{["q","fc","fu","fs"].forEach(i=>$("#"+i).value="");renderMM()};
}

  <div class="two"><div>

  <div class="card" style="margin-top:18px"><div class="st">Stock Information</div><div class="fg">${F("m-open","Opening Stock",I("m-open","Enter Opening Stock","number"))}${F("m-min","Minimum Stock Level",I("m-min","Enter Minimum Stock Level","number"))}${F("m-wh","Warehouse",'<select class="inp" id="m-wh"></select><button type="button" class="lnk" id="whb" style="margin-top:6px">+ Add new warehouse</button><div id="whn" style="display:flex;gap:6px;margin-top:6px"><input class="inp" id="whi" placeholder="Warehouse name"><button type="button" class="btn" id="whs">Save</button></div>')}</div></div>

  <div class="bar"><button class="btn g" data-go="p-material-management"><i data-lucide="arrow-left"></i>Back to Material Management</button><div style="display:flex;gap:10px"><button class="btn g" id="rs"><i data-lucide="rotate-ccw"></i>Reset</button><button class="btn" id="sv"><i data-lucide="save"></i>Save Material</button></div></div>`;

async function initMMAdd(){
  const dzw=wireDz(),db=await getDb();
  const ids=["m-name","m-code","m-cat","m-unit","m-open","m-min","m-wh","m-sup","m-supc","m-supt","m-desc"],req=["m-name","m-cat","m-unit","m-open","m-min","m-wh"];
  if(!$("#sv"))return;
  $("#whn").classList.add("hide");$("#whb").onclick=()=>$("#whn").classList.toggle("hide");
  let keep="";
  const fill=n=>{const s=$("#m-wh");if(!s)return;keep=s.value||keep;s.innerHTML=opts(n,n.length?"Select Warehouse":"No warehouses yet - add one below");s.value=keep};
  fill([]);if(db)unsub=db.collection("warehouses").onSnapshot(s=>fill(s.docs.map(d=>d.data().name).sort()),()=>{});
  $("#whs").onclick=async()=>{const n=$("#whi").value.trim();if(!n)return toast("Enter a warehouse name.",false);if(!db)return toast("Database is not available.",false);
    try{const r=db.collection("warehouses").doc(keyOf(n));if((await r.get()).exists)return toast("Warehouse already exists.",false);await r.set({name:n,createdAt:new Date().toISOString()});$("#whi").value="";keep=n;$("#whn").classList.add("hide");toast("Warehouse added.")}catch(e){toast("Could not save warehouse.",false)}};
  $("#rs").onclick=()=>{ids.forEach(i=>{$("#"+i).value="";$("#"+i).classList.remove("bad");const e=$("#e-"+i);if(e)e.textContent=""});keep="";dzw.clear()};
  $("#sv").onclick=async()=>{
    const v={};let ok=true;const bad=(i,m)=>{ok=false;$("#"+i).classList.add("bad");$("#e-"+i).textContent=m};
    ids.forEach(i=>{v[i]=$("#"+i).value.trim();$("#"+i).classList.remove("bad");const e=$("#e-"+i);if(e)e.textContent=""});
    req.forEach(i=>{if(!v[i])bad(i,"This field is required.")});
    const num=/^\d+(\.\d+)?$/;
    ["m-open","m-min"].forEach(i=>{if(v[i]&&!num.test(v[i]))bad(i,"Enter a number (0 or more).")});
    if(v["m-code"]&&!/^[A-Za-z0-9_-]+$/.test(v["m-code"]))bad("m-code","Use letters, numbers, - or _ only.");
    if(!ok)return toast("Please fix the highlighted fields.",false);
    if(!db)return toast("Database is not available. Nothing was saved.",false);
    const b=$("#sv");b.disabled=true;
    try{
      const all=(await db.collection("raw_materials").get()).docs.map(d=>d.data());
      if(all.some(m=>String(m.name).toLowerCase()===v["m-name"].toLowerCase())){bad("m-name","This material already exists.");toast("Duplicate material. Nothing was saved.",false);b.disabled=false;return}
      let code=v["m-code"].toUpperCase();
      if(code){if(all.some(m=>String(m.code||"").toUpperCase()===code)){bad("m-code","This code is already used.");toast("Duplicate code. Nothing was saved.",false);b.disabled=false;return}}
      else{let n=0;all.forEach(m=>{const x=/^MAT-(\d+)$/.exec(m.code||"");if(x)n=Math.max(n,+x[1])});code="MAT-"+String(n+1).padStart(4,"0")}
      const key=keyOf(code),ref=db.collection("raw_materials").doc(key);
      if((await ref.get()).exists){bad("m-code","This code is already used.");toast("Duplicate code. Nothing was saved.",false);b.disabled=false;return}
      let imageUrl="";const file=dzw.get();
      if(file){try{const a=await useAssets();imageUrl=(await a.upload(file)).url}catch(e){toast("Image upload failed. Nothing was saved.",false);b.disabled=false;return}}
      const now=new Date().toISOString(),qty=Number(v["m-open"]),user=store.get("nc_user")||"";
      await ref.set({id:key,code,name:v["m-name"],category:v["m-cat"],unit:v["m-unit"],openingStock:qty,availableStock:qty,minStock:Number(v["m-min"]),warehouse:v["m-wh"],supplier:v["m-sup"],supplierCode:v["m-supc"],supplierContact:v["m-supt"],description:v["m-desc"],imageUrl,createdBy:user,createdAt:now});
      const tid="TXN-"+Date.now().toString(36).toUpperCase();
      try{await db.collection("stock_transactions").doc(tid).set({transactionId:tid,type:"Opening Stock",itemType:"Raw Material",itemId:key,itemName:v["m-name"],unit:v["m-unit"],quantity:qty,previousBalance:0,newBalance:qty,reference:"OPEN-"+code,warehouse:v["m-wh"],supplier:v["m-sup"],user,notes:"Opening stock on material creation",createdAt:now})}
      catch(e){toast("Material saved, but the opening stock transaction failed. Please contact admin.",false);location.hash="p-material-management";return}
      toast("Material "+code+" saved successfully.");location.hash="p-material-management";
    }catch(e){toast("Could not save. Please try again.",false);b.disabled=false}
  };
}

function bomPage(){return `<div class="phead"><div><h2 class="t">BOM Management</h2><p class="sub">Create and manage the Bill of Materials for each chair model.</p></div><button class="btn" data-go="p-add-bom"><i data-lucide="plus"></i>Add New BOM</button></div><div id="bml" class="card"><div class="empty">Loading...</div></div>`}
async function initBom(){

  if(!db){box.innerHTML='<div class="empty">Database is not available. Open this page signed in to claude.ai.</div>';return}

async function initBomAdd(){
  const db=await getDb();if(!$("#sv"))return;
  let CMs=[],MTs=[],BOMs=[],rows=[],errs=[];
  if(db){try{
    CMs=(await db.collection("chair_models").get()).docs.map(d=>d.data()).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
    MTs=(await db.collection("raw_materials").get()).docs.map(d=>d.data()).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
    BOMs=(await db.collection("bom_headers").get()).docs.map(d=>d.data());
  }catch(e){toast("Could not load chair models and materials.",false)}}
  if(!$("#sv"))return;
  $("#b-model").innerHTML=`<option value="">${CMs.length?"Select Chair Model":"No chair models yet - add one in Product Stock"}</option>`+CMs.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} (${esc(c.sku)})</option>`).join("");
  const mt=id=>MTs.find(m=>m.id===id),fmt=n=>Number(n.toFixed(3)),g=i=>$("#"+i).value.trim();
  const renderRows=()=>{
    const used=rows.map(r=>r.m);
    $("#brows").innerHTML=rows.map((r,i)=>{const m=mt(r.m);
      const o=`<option value="">${MTs.length?"Select Material":"No materials yet - add in Material Management"}</option>`+MTs.map(x=>`<option value="${esc(x.id)}"${x.id===r.m?" selected":""}${used.includes(x.id)&&x.id!==r.m?" disabled":""}>${esc(x.name)}</option>`).join("");
      return `<tr><td>${i+1}</td><td><select class="inp" data-i="${i}" data-k="m" style="min-width:150px;color:#191919">${o}</select><div class="em">${esc(errs[i]||"")}</div></td><td>${esc(m?(m.code||"-"):"-")}</td><td><input class="inp" type="number" min="0" step="any" data-i="${i}" data-k="q" value="${esc(r.q)}" style="min-width:90px;color:#191919"></td><td>${esc(m?m.unit:"-")}</td><td><input class="inp" type="number" min="0" max="100" step="any" data-i="${i}" data-k="w" value="${esc(r.w)}" style="min-width:70px;color:#191919"></td><td><button type="button" class="lnk" data-rm="${i}">Remove</button></td></tr>`}).join("");
    $("#bemp").classList.toggle("hide",rows.length>0);
  };
  const renderPv=()=>{
    const cm=CMs.find(c=>c.id===$("#b-model").value),N=Math.max(1,Number($("#bn").value)||1);
    const meta=[g("b-name"),g("b-code"),g("b-ver")&&"Version "+g("b-ver"),g("b-status")].filter(Boolean).map(esc).join(" \u00b7 ");
    $("#pvh").innerHTML=(cm||g("b-name")||g("b-code"))?(cm?`<div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">${String(cm.imageUrl||"").match(/^(\/_blob\/|data:image\/)/)?`<img class="thumb" src="${esc(cm.imageUrl)}" alt="">`:'<div class="thumb"></div>'}<div><b>${esc(cm.name)}</b><div style="color:var(--grey);font-size:12px">${esc(cm.sku)} \u00b7 ${esc(cm.category)} \u00b7 ${esc(cm.colour)} \u00b7 ${esc(cm.size)}</div></div></div>`:"")+`<div style="color:var(--grey);font-size:12px">${meta}</div>`:'<div class="empty">Your BOM details will appear here.</div>';
    const ok=rows.filter(r=>mt(r.m));
    $("#pvt").innerHTML=ok.length?`<div class="tw"><table><thead><tr><th>Material</th><th>Per chair</th><th>With wastage</th><th>For ${N} chair${N>1?"s":""}</th></tr></thead><tbody>${ok.map(r=>{const m=mt(r.m),q=Number(r.q)||0,w=Number(r.w)||0,a=q*(1+w/100);return `<tr><td>${esc(m.name)}</td><td>${fmt(q)} ${esc(m.unit)}</td><td>${fmt(a)} ${esc(m.unit)}</td><td><b>${fmt(a*N)} ${esc(m.unit)}</b></td></tr>`}).join("")}</tbody></table></div>`:'<div class="empty">No materials added yet.</div>';
  };
  const fields=["b-name","b-code","b-model","b-ver","b-date","b-status","b-desc"];

/* ---- Material Issue: confirming deducts raw material stock. Writes are sequential (no multi-document transactions here); see postIssue. ---- */
const fmt3=n=>Number(Number(n).toFixed(3));
const ISS_AVAIL=(m,wh)=>m&&(!m.warehouse||m.warehouse===wh)?(Number(m.availableStock)||0):0;
function issueErrors(iss,rq,mats){
  const e=[];if(!(iss.items||[]).length)e.push("No material quantities entered.");
  (iss.items||[]).forEach(l=>{const m=mats[l.materialId],ri=(rq.items||[]).find(x=>x.materialId===l.materialId);
    if(!m||!ri){e.push(l.materialName+": material not found.");return}
    const av=ISS_AVAIL(m,iss.warehouse),out=ri.totalRequired-(ri.issuedQuantity||0);
    if(!(l.quantity>0))e.push(l.materialName+": quantity must be above 0.");
    else if(l.quantity>av+1e-9)e.push(l.materialName+": issue quantity exceeds available stock ("+fmt3(av)+" "+l.unit+").");
    else if(l.quantity>out+1e-9&&!iss.override)e.push(l.materialName+": exceeds the outstanding requirement ("+fmt3(Math.max(out,0))+" "+l.unit+"). An authorized override is needed.")});
  if(iss.override&&!(iss.authorizedBy&&iss.remarks))e.push("Override needs Authorized By and Remarks.");
  return e;
}
async function postIssue(db,issueId,user){
  const L=await db.collection("locks").doc("stock-posting").acquire({holder:user+"-"+Date.now(),ttlMs:20000});
  if(!L.acquired)throw new Error("Another stock posting is in progress. Please try again in a few seconds.");
  const iref=db.collection("material_issues").doc(issueId),is=await iref.get();
  if(!is.exists)throw new Error("Issue record not found.");
  const iss=is.data();if(iss.status!=="Draft")throw new Error("This issue is already "+iss.status+".");
  const rref=db.collection("material_requirements").doc(iss.requirementId),rq=(await rref.get()).data();
  if(!rq)throw new Error("The material requirement no longer exists.");
  const mats={};for(const l of iss.items)mats[l.materialId]=(await db.collection("raw_materials").doc(l.materialId).get()).data();
  const errs=issueErrors(iss,rq,mats);if(errs.length)throw new Error(errs.join(" "));
  const now=new Date().toISOString(),items=[];
  await iref.update({status:"Posting",postingBy:user,postingAt:now});
  try{
    let k=0;
    for(const l of iss.items){
      const m=mats[l.materialId],prev=Number(m.availableStock)||0,nb=fmt3(prev-l.quantity);
      await db.collection("raw_materials").doc(l.materialId).update({availableStock:nb});
      const tid="TXN-"+Date.now().toString(36).toUpperCase()+"-"+(k++);
      await db.collection("stock_transactions").doc(tid).set({transactionId:tid,type:"Material Issue",itemType:"Raw Material",itemId:l.materialId,itemName:l.materialName,unit:l.unit,quantity:l.quantity,previousBalance:fmt3(prev),newBalance:nb,reference:iss.number,warehouse:iss.warehouse,productionOrder:iss.productionOrderNo,issuedTo:iss.issuedTo,user,notes:"Issued to "+iss.issuedTo,createdAt:now});
      items.push({...l,previousBalance:fmt3(prev),newBalance:nb,txnId:tid});
    }
    const rItems=rq.items.map(ri=>{const l=iss.items.find(x=>x.materialId===ri.materialId);return l?{...ri,issuedQuantity:fmt3((ri.issuedQuantity||0)+l.quantity)}:ri});
    await rref.update({items:rItems,issueStatus:rItems.every(ri=>(ri.issuedQuantity||0)>=ri.totalRequired)?"Fully Issued":"Partially Issued"});
    await iref.update({status:"Confirmed",items,confirmedBy:user,confirmedAt:now});
  }catch(e){throw new Error("Issue "+iss.number+" is incomplete (status: Posting). Do not repeat it; contact the administrator.")}
}

/* ---- Material Consumption: records actual usage of material already issued. It never changes warehouse stock (Material Issue did that). ---- */
const CON_STAGES=["Cutting","Frame Assembly","Upholstery","Finishing","Quality Check","Packing","Other"];
async function conLoad(db){const L=async c=>(await db.collection(c).get()).docs.map(d=>d.data());
  const [ISs,CONs,RETs,WASs,WHs]=await Promise.all(["material_issues","material_consumptions","material_returns","material_wastages","warehouses"].map(L));
  return{ISs,CONs,RETs,WASs,WHs:WHs.map(w=>w.name).sort()}}
function conLines(D,po,wh){
  const M=new Map(),match=r=>r.status==="Confirmed"&&r.productionOrderNo===po&&(!wh||r.warehouse===wh);
  D.ISs.filter(match).forEach(i=>(i.items||[]).forEach(it=>{let l=M.get(it.materialId);if(!l){l={materialId:it.materialId,code:it.materialCode,name:it.materialName,unit:it.unit,issued:0,prev:0,ret:0,was:0};M.set(it.materialId,l)}l.issued=fmt3(l.issued+it.quantity)}));
  const add=(rows,f,k)=>rows.filter(match).forEach(r=>(r.items||[]).forEach(it=>{const l=M.get(it.materialId);if(l)l[k]=fmt3(l[k]+(Number(f(it))||0))}));
  add(D.CONs,it=>it.actualConsumed,"prev");add(D.RETs,it=>it.quantity,"ret");add(D.WASs,it=>it.quantity,"was");
  return [...M.values()]}
const conOut=l=>fmt3(l.issued-l.prev-l.ret-l.was);
function conErrors(c,lines){
  const e=[];if(!(c.items||[]).length)e.push("No consumption quantities entered.");
  (c.items||[]).forEach(it=>{const l=lines.find(x=>x.materialId===it.materialId);if(!l){e.push(it.materialName+": no confirmed issue found for this production order.");return}
    const out=conOut(l);
    if(!(it.actualConsumed>0))e.push(it.materialName+": quantity must be above 0.");
    else if(it.actualConsumed>out+1e-9&&!c.override)e.push(it.materialName+": exceeds the outstanding issued quantity ("+fmt3(Math.max(out,0))+" "+it.unit+"). An authorized adjustment is needed.")});
  if(c.override&&!(c.recordedBy&&c.remarks))e.push("An adjustment needs Recorded By and Remarks.");
  return e}
async function postCon(db,id,user){
  const L=await db.collection("locks").doc("consumption-posting").acquire({holder:user+"-"+Date.now(),ttlMs:20000});
  if(!L.acquired)throw new Error("Another consumption is being confirmed. Please try again in a few seconds.");
  const ref=db.collection("material_consumptions").doc(id),s=await ref.get();if(!s.exists)throw new Error("Consumption record not found.");
  const c=s.data();if(c.status!=="Draft")throw new Error("This voucher is already "+c.status+".");
  const lines=conLines(await conLoad(db),c.productionOrderNo,c.warehouse),errs=conErrors(c,lines);if(errs.length)throw new Error(errs.join(" "));
  const items=c.items.map(it=>{const l=lines.find(x=>x.materialId===it.materialId);return{...it,issuedQuantity:l.issued,previouslyConsumed:l.prev,returnedQuantity:l.ret,wastageQuantity:l.was,balance:fmt3(l.issued-l.prev-l.ret-l.was-it.actualConsumed)}});
  await ref.update({status:"Confirmed",items,confirmedBy:user,confirmedAt:new Date().toISOString()})}

/* ---- Production Tracking: orders, BOM-based material requirement, stage tracking, completion that inwards accepted chairs to Product Stock once ---- */
const PROD_STAGES=["Frame Manufacturing","Welding / Metal Work","Wood Work","Foam Cutting","Fabric Cutting","Upholstery","Assembly","Finishing","Final Quality Inspection"];
const PROD_MANDATORY=["Assembly","Finishing","Final Quality Inspection"];
const PROD_PRI=["Low","Normal","High","Urgent"],PROD_ST=["Draft","Planned","In Progress","Completed","On Hold"],STG_ST=["Pending","In Progress","Completed","On Hold"];
const PROD_DEPTS=[...PROD_STAGES,"Other"];
let PROD_EDIT=null;
const today=()=>new Date().toISOString().slice(0,10);
const prodBadge=s=>`<span class="badge" style="${s==="Completed"?"color:#1f7a3d;border-color:#1f7a3d":s==="In Progress"?"color:#0a58ca;border-color:#0a58ca":s==="On Hold"?"color:#a15c00;border-color:#a15c00":s==="Draft"?"":"color:#B51218;border-color:#B51218"}">${esc(s)}</span>`;
const newStages=()=>PROD_STAGES.map(n=>({name:n,status:"Pending",employee:"",startDate:"",completionDate:"",remarks:""}));
function prodCalc(bom,MTs,N,wh){return(bom.items||[]).map(it=>{const m=MTs.find(x=>x.id===it.materialId),base=it.quantity*N,w=base*(it.wastagePercent||0)/100,total=base+w,av=m&&(!m.warehouse||m.warehouse===wh)?Number(m.availableStock)||0:0,sh=Math.max(total-av,0);
  return{materialId:it.materialId,materialCode:m?m.code||"":it.materialCode,materialName:m?m.name:it.materialName,unit:m?m.unit:it.unit,bomQty:it.quantity,wastagePercent:it.wastagePercent||0,baseRequired:fmt3(base),wastageAllowance:fmt3(w),totalRequired:fmt3(total),availableStock:fmt3(av),shortage:fmt3(sh),status:sh>0?"Shortage":"Sufficient"}})}
function prodCompleteErrors(p){const e=[],st=p.stages||[];
  st.forEach(s=>{if(s.status!=="Completed"&&(PROD_MANDATORY.includes(s.name)||s.status==="In Progress"||s.status==="On Hold"))e.push(s.name+" must be Completed.")});
  if(!p.qualityApproved||!p.qualityApprovedBy)e.push("Quality inspection approval (with approver name) is required.");
  if((Number(p.completedQty)||0)+(Number(p.rejectedQty)||0)!==Number(p.quantity))e.push("Completed + rejected quantity must equal the planned quantity ("+p.quantity+").");
  return e}
async function postProd(db,id,user){
  const L=await db.collection("locks").doc("production-posting").acquire({holder:user+"-"+Date.now(),ttlMs:20000});
  if(!L.acquired)throw new Error("Another production posting is in progress. Please try again in a few seconds.");
  const ref=db.collection("production_orders").doc(id),s=await ref.get();if(!s.exists)throw new Error("Production order not found.");
  const p=s.data();if(p.status==="Completed"||p.completionState)throw new Error("Finished stock for this order was already posted.");
  if(p.status==="Draft")throw new Error("Move this order out of Draft before completing it.");
  const errs=prodCompleteErrors(p);if(errs.length)throw new Error(errs.join(" "));
  const cm=(await db.collection("chair_models").doc(p.chairModelId).get()).data();if(!cm)throw new Error("The chair model no longer exists in Product Stock.");
  const now=new Date().toISOString();await ref.update({completionState:"Posting"});
  try{
    const ok=Number(p.completedQty)||0,rej=Number(p.rejectedQty)||0,prev=Number(cm.availableStock)||0,nb=prev+ok;
    if(ok>0){await db.collection("chair_models").doc(p.chairModelId).update({availableStock:nb});
      const t="TXN-PROD-"+keyOf(p.number);await db.collection("stock_transactions").doc(t).set({transactionId:t,type:"Production Completion",itemType:"Finished Product",itemId:p.chairModelId,itemName:p.chairModelName,quantity:ok,previousBalance:prev,newBalance:nb,reference:p.number,warehouse:p.warehouse,user,notes:"Accepted chairs added from production order "+p.number,createdAt:now})}
    if(rej>0){const t="TXN-PRODREJ-"+keyOf(p.number);await db.collection("stock_transactions").doc(t).set({transactionId:t,type:"Production Rejection",itemType:"Finished Product",itemId:p.chairModelId,itemName:p.chairModelName,quantity:rej,stockEffect:0,reference:p.number,warehouse:p.warehouse,user,notes:"Rejected chairs recorded separately; not added to stock",createdAt:now})}
    await ref.update({status:"Completed",completionState:"Done",actualCompletion:p.actualCompletion||today(),finishedPosted:true,postedBy:user,postedAt:now,history:[...(p.history||[]),{at:now,by:user,action:"Production completed. "+ok+" accepted chairs added to Product Stock, "+rej+" rejected."}]})
  }catch(e){throw new Error("Order "+p.number+" completion is incomplete. Do not repeat it; contact the administrator.")}}
async function setProdStatus(db,id,ns,user){
  const ref=db.collection("production_orders").doc(id),p=(await ref.get()).data();
  if(!p||["Draft","Completed"].includes(p.status)||!["Planned","In Progress","On Hold"].includes(ns))throw new Error("This status change is not allowed.");
  const now=new Date().toISOString();await ref.update({status:ns,actualStart:p.actualStart||(ns==="In Progress"?today():""),history:[...(p.history||[]),{at:now,by:user,action:"Status changed from "+p.status+" to "+ns}]})}

  $("#s-sv").onclick=()=>{const v=i=>$("#"+i).value.trim();if(v("s-co").length<2)return $("#s-e").textContent="Enter the company name.";if(v("s-em")&&!EMAIL_RX.test(v("s-em")))return $("#s-e").textContent="Enter a valid email.";saveSet(db,{company:v("s-co"),email:v("s-em"),phone:v("s-ph"),gstin:v("s-gs").toUpperCase(),address:v("s-ad"),logo},"Company profile updated")};
}
function stSecurity(b,db){
  const N=(id,l,v,min,max,h)=>stF(l,`<input id="${id}" type="number" min="${min}" max="${max}" ${stI} value="${v}">`,h);
  b.innerHTML=`<div class="fg">${N("s-pw","Minimum password length",SET.minPw,6,20,"Applies to new and changed passwords.")}${N("s-ma","Failed logins before lockout",SET.maxAttempts,3,10)}${N("s-lm","Lockout duration (minutes)",SET.lockMin,1,120)}${N("s-se","Auto sign-out after inactivity (minutes, 0 = never)",SET.sessionMin,0,480)}</div>
  <div class="note" style="margin-top:14px">Passwords are stored as salted PBKDF2-SHA-256 hashes, never as plain text. Every sign-in, failed sign-in, user change and permission change is recorded in the Activity Log.</div>
  <div class="em" id="s-e" style="color:#B51218;min-height:18px;margin-top:8px"></div><div class="hbar"><button class="btn" id="s-sv" style="background:#7A3B14"><i data-lucide="save"></i>Save Security Settings</button></div>`;
  $("#s-sv").onclick=()=>{const n=i=>Number($("#"+i).value),chk=(v,a,z)=>Number.isInteger(v)&&v>=a&&v<=z;
    if(!chk(n("s-pw"),6,20)||!chk(n("s-ma"),3,10)||!chk(n("s-lm"),1,120)||!chk(n("s-se"),0,480))return $("#s-e").textContent="Check the values: password 6–20, attempts 3–10, lockout 1–120, inactivity 0–480.";
    saveSet(db,{minPw:n("s-pw"),maxAttempts:n("s-ma"),lockMin:n("s-lm"),sessionMin:n("s-se")},"Security settings updated")};
}
async function stInventory(b,db){
  b.innerHTML=`<label class="up-r" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="s-ng" ${SET.allowNegative!==false?"checked":""}><span><b>Allow authorised negative-stock exception</b><br><span style="color:var(--grey);font-size:12px">When on, an Admin can approve a Stock Transaction that takes stock below zero (a reason is required and it is logged). When off, stock can never go negative.</span></span></label>
  <div class="hbar" style="margin-top:8px"><button class="btn" id="s-sv" style="background:#7A3B14"><i data-lucide="save"></i>Save</button></div>
  <div style="font-weight:700;font-size:16px;margin:18px 0 8px">Warehouses</div><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="inp" id="w-n" placeholder="New warehouse name" style="flex:1;min-width:200px;color:#191919"><button class="btn" id="w-a" style="background:#7A3B14"><i data-lucide="plus"></i>Add Warehouse</button></div><div id="w-l" style="margin-top:12px"><div class="empty">Loading...</div></div>`;
  $("#s-sv").onclick=()=>saveSet(db,{allowNegative:$("#s-ng").checked},"Inventory rules updated");
  const load=async()=>{const L=async c=>(await db.collection(c).get()).docs.map(d=>d.data());const[w,cm,rm]=await Promise.all([db.collection("warehouses").get(),L("chair_models"),L("raw_materials")]);if(!$("#w-l"))return;
    const rows=w.docs.map(d=>({id:d.id,name:d.data().name})).filter(x=>x.name).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>({...x,n:cm.filter(c=>c.warehouse===x.name).length+rm.filter(m=>m.warehouse===x.name).length}));
    $("#w-l").innerHTML=rows.length?`<div class="tw"><table class="rep-t"><thead><tr><th>Warehouse</th><th>Items stored</th><th>Action</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.n}</td><td><button class="up-ia del" data-w="${esc(x.id)}" data-n="${esc(x.name)}" data-c="${x.n}" ${x.n?'disabled title="In use, move its items first"':'title="Delete warehouse"'} aria-label="Delete warehouse"><i data-lucide="trash-2"></i></button></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No warehouses yet. Add one above; it will appear in stock forms.</div>';icons();
    $("#w-l").querySelectorAll("[data-w]").forEach(btn=>btn.onclick=()=>confirmM("Delete warehouse",`Delete warehouse <b>${esc(btn.dataset.n)}</b>?`,"Delete",async()=>{await db.collection("warehouses").doc(btn.dataset.w).delete();await audit(db,"Settings","Warehouse deleted",btn.dataset.n);toast("Warehouse deleted.");load()},true))};
  $("#w-a").onclick=async()=>{const n=$("#w-n").value.trim();if(n.length<2)return toast("Enter a warehouse name.",false);const r=db.collection("warehouses").doc(keyOf(n));try{if((await r.get()).exists)return toast("Warehouse already exists.",false);await r.set({name:n,createdAt:new Date().toISOString()});await audit(db,"Settings","Warehouse added",n);$("#w-n").value="";toast("Warehouse added.");load()}catch(e){toast("Could not add the warehouse.",false)}};
  load();
}
function stBackup(b,db){
  b.innerHTML=`<div class="note" style="margin:0 0 12px">Download a complete copy of your ERP data as one JSON file. Keep it somewhere safe. Password hashes and security fields are never included.</div><button class="btn" id="bk" style="background:#7A3B14"><i data-lucide="download"></i>Download Backup</button><div id="bk-i" style="margin-top:12px;color:var(--grey)"></div>`;
  $("#bk").onclick=async()=>{const btn=$("#bk");btn.disabled=true;const C=["chair_models","raw_materials","warehouses","stock_transactions","bom_headers","material_requirements","material_issues","material_returns","material_consumptions","material_wastages","production_orders","employees","attendance","leave_requests","salary_structures","salary_records","salary_payments","hr_settings","app_settings","role_permissions","users","audit_logs"],out={app:"Nagesh Chairs Factory ERP",exportedAt:new Date().toISOString(),exportedBy:U(),collections:{}};
    try{for(const c of C){const s=await db.collection(c).get();out.collections[c]=s.docs.map(d=>{const v={...d.data()};if(c==="users"){delete v.passHash;delete v.passSalt;delete v.passIter}return v})}
      const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nagesh-erp-backup-"+todayS()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      await audit(db,"Settings","Backup downloaded","");$("#bk-i").textContent=C.length+" collections, "+Object.values(out.collections).reduce((s,x)=>s+x.length,0)+" records exported.";toast("Backup downloaded.")}catch(e){toast("Could not create the backup.",false)}btn.disabled=false};
}
function stAccount(b){
  const u=CURP||{};
  b.innerHTML=`<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><span class="up-av" style="width:58px;height:58px;font-size:20px">${esc(initials(u.name||U()))}</span><div><h3 style="margin:0">${esc(u.name||U())}</h3><div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${u.role?rolePill(u.role):""}</div></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 22px">${[["Email",u.email],["Department",u.department],["Phone",u.phone],["Last login",fdt(u.lastLogin)]].map(([k,v])=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-size:11px;color:var(--grey);text-transform:uppercase">${k}</div><div style="font-weight:600;margin-top:2px">${esc(v||"-")}</div></div>`).join("")}</div>
  ${CURP?`<div class="up-chips" style="margin-top:12px">${permSummary(EFF||{})}</div><div class="hbar"><button class="btn" id="a-pw" style="background:#7A3B14"><i data-lucide="key-round"></i>Change Password</button></div>`:""}`;
  const p=$("#a-pw");if(p)p.onclick=()=>pwModal(false);
}

buildNav(); icons(); boot();
